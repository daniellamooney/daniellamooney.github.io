          <<figure>
            <img src="images/99.jpg" alt="Inarticulate eloquence">
            <figcaption><i>Inarticulate eloquence <br>“This is recorded on sticky-tape and rust. This is recorded on sticky-tape and rust.” These are the words of engineer and cartoonist Tim Hunkin, recording speech onto diy tape reel during a TV series called, ‘The secret life of machines’. It was this eerie recorded experiment which gave me the idea to try make my own sound artefact in low fidelity rust. This carved soapstone cassette tape, titled Inarticulate Eloquence, explores the often unrequited communication with family who have passed. The homemade tape-reel inserted in the stone carries a message for my family for when im gone. A mute wish set in the future held within a stone casing, where stone here, as is often with my work, is used as medium and vessel for memory.”<br></i><br>Soapstone, plastic tape cogs, iron oxide on sticky-tape<br>10.2 x 6.4 x 1.27cm<br>2026</figcaption>
